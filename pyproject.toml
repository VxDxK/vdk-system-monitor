[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vsm"
version = "0.1.0"
description = "Typed async multidevice experiments and Linux diagnostics"
requires-python = ">=3.14"
dependencies = [
    "asyncssh>=2.21",
    "pandas>=2.3",
    "plotly>=6.3",
    "matplotlib>=3.10",
]

[project.scripts]
vsm = "vsm.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "pytest-cov>=6", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.coverage.run]
branch = true
source = ["vsm"]

[tool.hatch.build.targets.wheel]
packages = ["src/vsm"]

[tool.hatch.build.targets.wheel.force-include]
"binary-utils/src/bin" = "vsm/_native_sources"
