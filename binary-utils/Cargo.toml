[package]
name = "binary-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
socket2 = { version = "0.6.4", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt", "time", "signal", "sync", "net", "io-util"] }

[profile.release]
lto = true
strip = true
