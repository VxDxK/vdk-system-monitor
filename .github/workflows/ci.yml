name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --dev --locked
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --manifest-path binary-utils/Cargo.toml --check
      - name: Lint Rust and Python
        run: just lint

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --dev --locked
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run Rust unit tests
        run: just test-rust
      - name: Run Python tests with branch coverage
        run: just test-python
      - name: Upload Python coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-coverage
          path: |
            reports/python-html/
            reports/python-coverage.json
            reports/python-coverage.xml
          if-no-files-found: ignore
